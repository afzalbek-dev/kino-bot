[project]
name = "kino-bot"
version = "1.0.0"
description = "Aiogram 3 Telegram movie discovery bot with VIP access, favorites, and admin workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.10,<4",
  "aiosqlite>=0.20",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["kino_bot*"]
